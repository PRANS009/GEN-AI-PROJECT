      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before retrying.
    E500:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Dependency unavailable or invalid provider response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
